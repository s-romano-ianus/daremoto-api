<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso effettuato - DareMoto</title>
    <link rel="icon" href="/account/icon.svg" type="image/svg+xml">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f5f9; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #0B1033; }
        .box { text-align: center; background: #fff; padding: 2.5rem 2rem; border-radius: 14px; box-shadow: 0 2px 14px rgba(11, 16, 51, .08); max-width: 420px; width: calc(100% - 32px); box-sizing: border-box; }
        .logo { height: 40px; margin-bottom: 1.5rem; }
        .icon { width: 64px; height: 64px; border-radius: 50%; background: #D4F53C; color: #0B1033; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
        h1 { font-size: 1.6rem; margin: 0 0 .75rem; }
        p { color: #4a4f6a; line-height: 1.6; margin: 0 0 1.75rem; }
        .btn { display: inline-block; padding: 10px 22px; background: #0B1033; color: #fff; text-decoration: none; border-radius: 999px; font-weight: 600; }
        .btn:hover { background: #1c2360; }
    </style>
    <script>
        // /api/oidc/msg sets msg to the Italian text of this message id
        var title = '', msg = '';
        document.writeln('<script src="/api/oidc/msg?lang=it&msg=' + encodeURIComponent('{{.message}}') + '"><\/script>');
    </script>
</head>
<body>
<div class="box">
    <img class="logo" src="/account/logo.svg" alt="DareMoto">
    <div><span class="icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div>
    <h1 id="h1">Accesso effettuato</h1>
    <p>Puoi chiudere questa pagina e tornare a DareMoto.</p>
    <a href="javascript:window.close()" class="btn">Chiudi</a>
</div>
<script>
    if (msg) document.getElementById('h1').innerText = msg;
    document.title = document.getElementById('h1').innerText + ' - DareMoto';
</script>
</body>
</html>
